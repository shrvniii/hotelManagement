<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your VHotels membership account. Unlock exclusive benefits, private resort access, and bespoke concierge services.">
  <title>VHotels | Member Registration</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <!-- Back to Home Navigation Link -->
  <a href="index.html" class="back-to-home" id="btn-back">
    <i class="fas fa-chevron-left"></i> Back to Home
  </a>

  <!-- Centered Glassmorphism Registration Card -->
  <main class="login-card reg-card" id="register-container">
    <header class="login-header">
      <div class="login-logo">VHotels</div>
      <p>Luxury Elite Membership</p>
      <h2>Create Your Account</h2>
    </header>

    <form class="login-form" id="member-register-form" novalidate>
      
      <!-- Salutation Title & First Name (2 Columns) -->
      <div class="form-row">
        <div class="form-group" style="flex: 0.4;">
          <div class="input-wrapper">
            <select id="title" required>
              <option value="Mr." selected>Mr.</option>
              <option value="Ms.">Ms.</option>
              <option value="Mrs.">Mrs.</option>
              <option value="Dr.">Dr.</option>
              <option value="Lord">Lord</option>
              <option value="Lady">Lady</option>
            </select>
          </div>
          <span class="error-msg" id="title-error"></span>
        </div>

        <div class="form-group" style="flex: 1;">
          <div class="input-wrapper">
            <input type="text" id="first-name" placeholder=" " required autocomplete="given-name">
            <label for="first-name">First Name (alphabets only)</label>
          </div>
          <span class="error-msg" id="first-name-error"></span>
        </div>
      </div>

      <!-- Last Name & Date of Birth -->
      <div class="form-row">
        <div class="form-group">
          <div class="input-wrapper">
            <input type="text" id="last-name" placeholder=" " required autocomplete="family-name">
            <label for="last-name">Last Name</label>
          </div>
          <span class="error-msg" id="last-name-error"></span>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <input type="date" id="dob" required>
            <label for="dob" style="top: -10px; font-size: 0.75rem; color: var(--color-gold);">Date of Birth</label>
          </div>
          <span class="error-msg" id="dob-error"></span>
        </div>
      </div>

      <!-- Email ID Field -->
      <div class="form-group">
        <div class="input-wrapper">
          <input type="email" id="reg-email" placeholder=" " required autocomplete="email">
          <label for="reg-email">Email Address (name@domain.com)</label>
        </div>
        <span class="error-msg" id="reg-email-error"></span>
      </div>

      <!-- Password & Mobile Number (2 Columns) -->
      <div class="form-row">
        <div class="form-group">
          <div class="input-wrapper">
            <input type="password" id="reg-password" placeholder=" " required autocomplete="new-password">
            <label for="reg-password">Password (min 8 chars, 1 caps, 1 no, 1 symbol)</label>
            <span class="toggle-password" id="reg-eye-toggle"><i class="fas fa-eye"></i></span>
          </div>
          <span class="error-msg" id="reg-password-error"></span>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <input type="tel" id="mobile" placeholder=" " required autocomplete="tel" maxlength="10">
            <label for="mobile">Mobile Number (10 digits)</label>
          </div>
          <span class="error-msg" id="mobile-error"></span>
        </div>
      </div>

      <!-- Preferred Estate Selection -->
      <div class="form-group">
        <div class="input-wrapper">
          <select id="preferred-resort" required>
            <option value="" disabled selected>Select Preferred Resort Estate...</option>
            <option value="VHotels Palace (Rajasthan)">VHotels Palace (Udaipur & Jaipur, Rajasthan)</option>
            <option value="VHotels Backwaters (Kerala)">VHotels Backwaters (Kumarakom, Kerala)</option>
            <option value="VHotels Coastal (Goa)">VHotels Coastal (Candolim, Goa)</option>
            <option value="VHotels Bay (Mumbai)">VHotels Bay (Marine Drive, Mumbai)</option>
            <option value="VHotels Himalayan (Kashmir)">VHotels Himalayan (Gulmarg, Kashmir)</option>
            <option value="VHotels Heritage (Varanasi)">VHotels Heritage (Ganga Ghats, Varanasi)</option>
            <option value="VHotels Riviera (Maldives)">VHotels Riviera (Maldives)</option>
            <option value="VHotels Alpine Lodge (St. Moritz)">VHotels Alpine Lodge (St. Moritz)</option>
            <option value="VHotels Heights (New York)">VHotels Heights (New York)</option>
          </select>
        </div>
        <span class="error-msg" id="resort-error"></span>
      </div>

      <!-- Address Field -->
      <div class="form-group">
        <div class="input-wrapper input-wrapper-textarea">
          <textarea id="address" placeholder=" " required rows="2" autocomplete="street-address"></textarea>
          <label for="address">Full Residential Address</label>
        </div>
        <span class="error-msg" id="address-error"></span>
      </div>

      <!-- Global Submit Alert -->
      <div id="general-reg-error" style="color: #e74c3c; font-size: 0.85rem; margin-bottom: 12px; display: none;"></div>

      <!-- Action Buttons -->
      <div class="login-actions" style="margin-top: 15px;">
        <button type="submit" class="btn-gold" id="btn-reg-submit" style="width: 100%;">Register Elite Membership</button>
      </div>
    </form>

    <!-- Card Footer Links -->
    <footer class="login-footer" style="margin-top: 20px;">
      Already a member? <a href="login.html">Sign In</a>
    </footer>

    <!-- Copyright -->
    <div class="login-copyright">
      &copy; 2026 VHotels Resorts. All Rights Reserved.
    </div>
  </main>

  <!-- Frontend Logic -->
  <script src="vhotels.js"></script>
  <script>
    document.getElementById('member-register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('title').value;
      const firstName = document.getElementById('first-name').value.trim();
      const lastName = document.getElementById('last-name').value.trim();
      const dob = document.getElementById('dob').value;
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const mobile = document.getElementById('mobile').value.trim();
      const preferredResort = document.getElementById('preferred-resort').value;
      const address = document.getElementById('address').value.trim();

      // Reset errors
      document.querySelectorAll('.error-msg').forEach(el => {
        el.textContent = '';
        el.classList.remove('visible');
      });
      const genErr = document.getElementById('general-reg-error');
      genErr.style.display = 'none';

      let hasError = false;

      // Validate registration fields
      if (!firstName || !/^[A-Za-z]+$/.test(firstName)) {
        const el = document.getElementById('first-name-error');
        el.textContent = 'First name must contain only alphabetic characters (no digits or symbols).';
        el.classList.add('visible');
        hasError = true;
      }

      if (!lastName) {
        const el = document.getElementById('last-name-error');
        el.textContent = 'Last name cannot be empty.';
        el.classList.add('visible');
        hasError = true;
      }

      const emailRegex = /^[\w\.-]+@[\w\.-]+\.\w{2,4}$/;
      if (!email || !emailRegex.test(email)) {
        const el = document.getElementById('reg-email-error');
        el.textContent = 'Please enter a valid email (e.g. name@domain.com).';
        el.classList.add('visible');
        hasError = true;
      }

      const passHasCaps = /[A-Z]/.test(password);
      const passHasNo = /[0-9]/.test(password);
      const passHasSymbol = /[^A-Za-z0-9]/.test(password);
      if (!password || password.length < 8 || !passHasCaps || !passHasNo || !passHasSymbol) {
        const el = document.getElementById('reg-password-error');
        el.textContent = 'Password must be at least 8 characters with at least 1 uppercase letter, 1 number, and 1 symbol.';
        el.classList.add('visible');
        hasError = true;
      }

      if (!mobile || !/^\d{10}$/.test(mobile)) {
        const el = document.getElementById('mobile-error');
        el.textContent = 'Mobile number must be exactly 10 digits.';
        el.classList.add('visible');
        hasError = true;
      }

      if (!address) {
        const el = document.getElementById('address-error');
        el.textContent = 'Residential address cannot be empty.';
        el.classList.add('visible');
        hasError = true;
      }

      if (hasError) return;

      const btn = document.getElementById('btn-reg-submit');
      btn.textContent = 'Creating Account...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title,
            first_name: firstName,
            last_name: lastName,
            dob,
            email,
            password,
            mobile,
            preferred_resort: preferredResort,
            address
          })
        });

        const data = await res.json();
        if (data.success) {
          VHotels.showToast('Registration successful! Welcome to VHotels.', 'success');
          setTimeout(() => {
            window.location.href = 'profile.html';
          }, 800);
        } else {
          genErr.textContent = data.message || 'Registration failed.';
          genErr.style.display = 'block';
          btn.textContent = 'Register Elite Membership';
          btn.disabled = false;
        }
      } catch (err) {
        genErr.textContent = 'Network error connecting to backend.';
        genErr.style.display = 'block';
        btn.textContent = 'Register Elite Membership';
        btn.disabled = false;
      }
    });

    document.getElementById('reg-eye-toggle')?.addEventListener('click', () => {
      const p = document.getElementById('reg-password');
      p.type = p.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
