<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Access your VHotel membership. Manage bookings, view invoices, and unlock premium concierge benefits.">
  <title>VHotel | Member Portal</title>
  
  <!-- Font Awesome for premium icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <!-- Back to Home Navigation Link -->
  <a href="index.html" class="back-to-home" id="btn-back">
    <i class="fas fa-chevron-left"></i> Back to Home
  </a>

  <!-- Centered Glassmorphism Card -->
  <main class="login-card" id="login-container">
    <header class="login-header">
      <div class="login-logo">VHotels</div>
      <p>Luxury Member Portal</p>
      <h2>Welcome Back</h2>
    </header>

    <form class="login-form" id="member-login-form" novalidate>
      <!-- Email Field (Floating Label) -->
      <div class="form-group">
        <div class="input-wrapper">
          <input type="email" id="email" placeholder=" " required autocomplete="email">
          <label for="email">Email Address</label>
        </div>
        <span class="error-msg" id="email-error"></span>
      </div>

      <!-- Password Field (Floating Label) -->
      <div class="form-group">
        <div class="input-wrapper">
          <input type="password" id="password" placeholder=" " required autocomplete="current-password">
          <label for="password">Password</label>
          <span class="toggle-password" id="eye-toggle"><i class="fas fa-eye"></i></span>
        </div>
        <span class="error-msg" id="password-error"></span>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="remember">
          <span class="checkbox-custom"></span>
          Remember Me
        </label>
        <a href="#" class="forgot-password" onclick="alert('A password reset code has been sent if the email exists.');">Forgot Password?</a>
      </div>

      <!-- Action Buttons -->
      <div class="login-actions">
        <button type="submit" class="btn-gold" id="btn-submit">Login Portal</button>
        <button type="button" class="btn-outline" id="btn-guest" onclick="alert('Entering guest browsing view.'); window.location.href='index.html';">Continue as Guest</button>
      </div>
    </form>

    <!-- Card Footer Links -->
    <footer class="login-footer">
      Don't have an account? <a href="register.html">Sign Up</a>
    </footer>

    <!-- Copyright -->
    <div class="login-copyright">
      &copy; 2026 VHotels Resorts. All Rights Reserved.
    </div>
  </main>

  <!-- Frontend Logic -->
  <script src="script.js"></script>
</body>
</html>
